{% extends "base.html" %}
{% block head %}<meta name="robots" content="noindex">
<style>
.admin-nav{display:flex;gap:.4rem;flex-wrap:wrap;margin:1rem 0}
.admin-nav a{padding:.45rem .8rem;border:1px solid var(--line,#d5dae1);border-radius:8px;text-decoration:none}
.admin-nav a[aria-current=page]{background:var(--accent,#2f6fed);color:#fff;border-color:transparent}
table.list{width:100%;border-collapse:collapse;font-size:.95rem}
table.list th,table.list td{padding:.5rem;border-bottom:1px solid var(--line,#e2e5ea);text-align:start;vertical-align:top}
.adm-form{display:grid;gap:.7rem;max-width:760px}
.adm-form label{display:grid;gap:.25rem}
.adm-form input[type=text],.adm-form input[type=number],.adm-form input[type=url],.adm-form input[type=password],.adm-form textarea,.adm-form select{padding:.5rem;border:1px solid #c9ced6;border-radius:8px;font:inherit}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
fieldset{border:1px solid #e2e5ea;border-radius:10px;padding:.8rem}
.ok{background:#e7f6ea;padding:.6rem;border-radius:8px}
.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:8px}
</style>{% endblock %}
{% block main %}
<div class="wrap section">
{% if request.session.get('admin') %}
<nav class="admin-nav" aria-label="ניהול">
  {% set p = request.url.path %}
  <a href="/admin" {% if p == '/admin' or p.startswith('/admin/orders') %}aria-current="page"{% endif %}>הזמנות</a>
  <a href="/admin/settings" {% if p == '/admin/settings' %}aria-current="page"{% endif %}>הגדרות ומחירים</a>
  <a href="/admin/products" {% if p == '/admin/products' %}aria-current="page"{% endif %}>גלריה</a>
  <a href="/admin/posts" {% if p == '/admin/posts' %}aria-current="page"{% endif %}>עדכונים</a>
  <a href="/admin/subscribers" {% if p == '/admin/subscribers' %}aria-current="page"{% endif %}>רשימת דיוור</a>
  <a href="/admin/logout">יציאה</a>
</nav>
{% endif %}
{% block admin %}{% endblock %}
</div>
{% endblock %}
