[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printyz-clicker"
version = "0.1.0"
description = "PRINTYZ Clicker Studio - parametric MX clicker generator"
requires-python = ">=3.11,<3.14"  # build123d/OCP wheels: 3.14 not supported yet
dependencies = [
    "build123d>=0.9",
    "fonttools>=4.40",
    "numpy>=1.26",
    "trimesh>=4.0",
    "manifold3d>=2.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
printyz = "printyz_clicker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds real CAD geometry"]
